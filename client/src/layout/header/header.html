@if (!isAuthorized())
{
    <div style="float: right;">
        <button (click)="showLoginModal()">Login or register</button>
    </div>
}
@else
{
    <div style="float: right;">
        Logged as {{ currentUserName() }}
        <button (click)="logout()">logout</button>
    </div>
}

<login-dialog #loginDialog />
