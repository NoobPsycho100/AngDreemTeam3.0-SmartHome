@if (!isAuthorized())
{
    <div style="float: right;">
        <button (click)="showLoginModal('login')">Login or register</button>
    </div>
}
@else
{
    <div style="float: right;">
        Logged as {{ currentUserName() }}
        <button (click)="logout()">logout</button>
        <button (click)="showLoginModal('register-as-admin')" *appIfHasPermission="'RegisterAdmin'">Register another</button>
    </div>
}

<login-dialog #loginDialog />
